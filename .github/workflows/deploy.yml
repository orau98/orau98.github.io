name: Deploy with GitHub Actions Pages

on:
  workflow_dispatch:
  push:
    branches: [ main ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CI: true
      TZ: UTC
      NODE_OPTIONS: --max-old-space-size=4096
      FORCE_RESPONSIVE_IMAGES: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies (npm ci)
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Validate normalized data
        run: npm run validate-normalized

      - name: Sync runtime CSVs into public/
        run: npm run sync:public-insects

      - name: Refresh plant image filename index
        run: node scripts/update_plant_image_filenames.mjs

      - name: Refresh insect image indexes
        run: npm run build:image-index

      - name: Build responsive images
        run: npm run build:images:responsive

      - name: Build data-lite
        run: npm run build:data-lite

      - name: Generate meta pages
        run: npm run generate-meta:all

      - name: Build (vite only)
        run: npm run build:app

      - name: Generate sitemaps
        run: npm run generate-sitemap

      - name: Post-build cleanup and asset sync
        run: node scripts/postbuild-cleanup.mjs

      - name: Add .nojekyll
        run: |
          echo > dist/.nojekyll

      - name: Smoke check
        run: npm run smoke:dist

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

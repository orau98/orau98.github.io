name: Deploy with GitHub Actions Pages

on:
  workflow_dispatch:
  push:
    branches: [ main ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CI: true
      TZ: UTC
      NODE_OPTIONS: --max-old-space-size=4096
      FORCE_RESPONSIVE_IMAGES: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies (npm ci)
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Validate source, lint and regression tests
        run: npm run check:source

      # 写真の縮小版は元画像が変わらない限り前回の結果を使い回す（以前は毎回約7分かけて作り直していた）。
      # .cache/resized は縮小版の保管場所、.cache/responsive-images.json は元画像の指紋。
      # 元画像が同じ名前で差し替えられたときは指紋の食い違いで検出して作り直す。
      - name: Restore responsive image cache
        uses: actions/cache@v4
        with:
          path: .cache
          key: responsive-images-v1-${{ hashFiles('public/images/insects/**', 'public/images/plants/**', 'scripts/build-responsive-images.mjs', 'scripts/lib/imageAssetConstants.mjs') }}
          restore-keys: |
            responsive-images-v1-

      # ビルド工程の定義は scripts/build-site.mjs の1か所だけ（ci.yml・手元の npm run build と共通）
      - name: Build site
        env:
          RESPONSIVE_CACHE_DIR: .cache/resized
        run: npm run build

      - name: Validate built artifact before upload
        run: npm run check:dist

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

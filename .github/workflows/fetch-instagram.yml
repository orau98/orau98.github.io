name: Fetch Instagram Posts

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *'

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    env:
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      POST_LIMIT: '10'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check Instagram secrets
        id: secret-check
        run: |
          if [ -z "${IG_ACCESS_TOKEN}" ] || [ -z "${IG_USER_ID}" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "Instagram secrets not set. Skipping."
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Update instagram_posts.txt (uses provided script or archive fallback)
        if: steps.secret-check.outputs.skip != 'true'
        run: |
          if [ -f scripts/update-instagram-posts.js ]; then
            node scripts/update-instagram-posts.js
          elif [ -f scripts/_archive/update-instagram-posts.js ]; then
            node scripts/_archive/update-instagram-posts.js
          else
            echo "No instagram update script found. Skipping." && exit 0
          fi

      - name: Commit changes
        if: steps.secret-check.outputs.skip != 'true'
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add public/instagram_posts.txt public/instagram_latest.txt
            git commit -m "chore(instagram): update instagram posts via Graph API"
            git push
          else
            echo "No instagram changes to commit."
          fi

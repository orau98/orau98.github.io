name: Fetch Instagram Posts

on:
  workflow_dispatch:
  schedule:
    - cron: '15 3 * * *'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: fetch-instagram
  cancel-in-progress: true

permissions:
  contents: write
  actions: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      IG_USERNAME: ${{ secrets.IG_USERNAME || 'onychodactylus_nipponoborealis' }}
      POST_LIMIT: '10'
      IG_CACHE_MAX_AGE_HOURS: '72'
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Sync latest main before updating
        run: |
          git fetch origin main
          git pull --ff-only origin main

      - name: Update instagram_posts.txt (uses provided script or archive fallback)
        run: |
          if [ -f scripts/update-instagram-posts.js ]; then
            node scripts/update-instagram-posts.js
          elif [ -f scripts/_archive/update-instagram-posts.js ]; then
            node scripts/_archive/update-instagram-posts.js
          else
            echo "No instagram update script found. Skipping." && exit 0
          fi

      - name: Commit changes
        id: commit_changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/instagram_posts.txt public/instagram_latest.txt public/instagram_posts.json public/instagram
          if ! git diff --cached --quiet; then
            git commit -m "chore(instagram): update instagram posts"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "No instagram changes to commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger deploy workflow
        if: steps.commit_changes.outputs.changed == 'true'
        uses: actions/github-script@v8
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'deploy.yml',
              ref: 'main',
            });

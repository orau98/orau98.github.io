name: Generate Sitemaps

on:
  workflow_dispatch:
  # 手動実行のみ（自動更新はデプロイ時の prebuild で反映）

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: sitemap-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-and-generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Setup build cache (optional)
        run: echo "skip app build for sitemap generation"

      - name: Generate split sitemaps (project script)
        run: node scripts/generate-sitemap-split.js

      - name: Generate sitemap.xml (crawler)
        uses: cicirello/generate-sitemap@v1
        with:
          base-url-path: https://orau98.github.io
          include-html: true
          sitemap-path: ./public

      - name: Commit and push sitemap changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'chore(sitemap): update sitemap_index.xml and sitemaps'
          branch: main
          file_pattern: public/sitemap*.xml public/sitemap.xml

name: CI

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build-and-validate:
    # ubuntu-latest は 2026年11月に Ubuntu 26.04 へ移り、Playwright 1.56.1 がブラウザを入れられなくなった
    # （"Playwright does not support chromium on ubuntu26.04-x64"）。画面確認に使うので対応版に固定する
    runs-on: ubuntu-24.04
    env:
      NODE_OPTIONS: --max-old-space-size=4096
      SKIP_RESPONSIVE_IMAGES: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate source, lint and regression tests
        run: npm run check:source

      # ビルド工程の定義は scripts/build-site.mjs の1か所だけ（deploy.yml・手元の npm run build と共通）。
      # PRでは写真の縮小版づくりを省く（SKIP_RESPONSIVE_IMAGES）
      - name: Build site
        run: npm run build

      - name: Validate built artifact
        run: npm run check:dist

      # 主要な画面（トップ・一覧・詳細・検索・英語・クイズ）を実際のブラウザで開き、
      # 中身が出る・エラーが出ない・スマホで横にはみ出さないことを確かめる
      - name: Install browser for screen checks
        run: npx playwright install --with-deps chromium

      - name: Check main screens in a real browser
        run: npm run check:browser

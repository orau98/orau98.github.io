name: CI

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build-and-validate:
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: --max-old-space-size=4096
      SKIP_RESPONSIVE_IMAGES: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate source, lint and regression tests
        run: npm run check:source

      - name: Sync runtime CSVs into public/
        run: npm run sync:public-insects

      - name: Build lite datasets
        run: npm run build:data-lite

      - name: Refresh plant image filename index
        run: npm run build:plant-image-index

      - name: Build image index
        run: npm run build:image-index

      - name: Build responsive images
        run: npm run build:images:responsive

      - name: Generate meta pages
        run: npm run generate-meta:all

      - name: Build app
        run: npm run build:app

      - name: Generate sitemaps
        run: npm run generate-sitemap

      - name: Post-build cleanup
        run: node scripts/postbuild-cleanup.mjs

      - name: Validate built artifact
        run: npm run check:dist

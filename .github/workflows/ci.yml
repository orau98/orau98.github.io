name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build-and-validate:
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: --max-old-space-size=4096
      SKIP_RESPONSIVE_IMAGES: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Data validation (normalized CSV)
        run: npm run validate-normalized

      - name: Build lite datasets
        run: npm run build:data-lite

      - name: Refresh plant image filename index
        run: npm run build:plant-image-index

      - name: Build image index
        run: npm run build:image-index

      - name: Build responsive images
        run: npm run build:images:responsive

      - name: Generate meta pages
        run: npm run generate-meta:all

      - name: Build app
        run: npm run build:app

      - name: Generate sitemaps
        run: npm run generate-sitemap

      - name: Post-build cleanup
        run: node scripts/postbuild-cleanup.mjs

      - name: Smoke check
        run: npm run smoke:dist

      - name: Audit image resolution
        run: npm run audit:image-resolution

      - name: Audit SEO output
        run: npm run audit:seo

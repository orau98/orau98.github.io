name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-validate:
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: --max-old-space-size=4096
      SKIP_RESPONSIVE_IMAGES: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Data validation (normalized CSV)
        run: npm run validate-normalized

      - name: Build lite datasets
        run: npm run build:data-lite

      - name: Build app
        run: npm run build:app

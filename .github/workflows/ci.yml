name: CI

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build-and-validate:
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: --max-old-space-size=4096
      SKIP_RESPONSIVE_IMAGES: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate source, lint and regression tests
        run: npm run check:source

      # ビルド工程の定義は scripts/build-site.mjs の1か所だけ（deploy.yml・手元の npm run build と共通）。
      # PRでは写真の縮小版づくりを省く（SKIP_RESPONSIVE_IMAGES）
      - name: Build site
        run: npm run build

      - name: Validate built artifact
        run: npm run check:dist

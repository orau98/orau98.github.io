<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="昆虫植物図鑑 - かじられた葉">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#059669"/>
      <stop offset="1" stop-color="#0d9488"/>
    </linearGradient>
    <mask id="bite">
      <rect width="64" height="64" fill="#ffffff"/>
      <!-- 食痕（シートの3箇所を維持しつつ、16pxでも読めるよう深く） -->
      <circle cx="53" cy="25" r="8.5" fill="#000000"/>
      <circle cx="45" cy="51" r="7" fill="#000000"/>
      <circle cx="20" cy="16" r="5.5" fill="#000000"/>
      <!-- 主脈（シートと同じ位置・グラデを透かす） -->
      <path d="M30 15 C30 27 32 40 36 51" fill="none" stroke="#000000" stroke-width="2.6" stroke-linecap="round"/>
    </mask>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <g mask="url(#bite)">
    <!-- 葉本体（シートの案Aと同じ丸みの強い輪郭） -->
    <path d="M32 10 C48 16 54 30 50 44 C46 54 36 56 30 54 C18 50 12 36 16 24 C19 15 26 11 32 10 Z" fill="#ffffff"/>
  </g>
</svg>

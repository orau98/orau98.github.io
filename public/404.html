<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>Page Not Found | 昆虫植物図鑑</title>
  <meta name="robots" content="noindex, follow, max-image-preview:none">
  <meta name="description" content="GitHub Pages の SPA ルーティング用 404 フォールバックです。検索結果には表示しません。">
  <link rel="canonical" href="https://orau98.github.io/">
  <script type="text/javascript">
    window.__SEO_FORCE_NOINDEX__ = true;
    // GitHub Pages SPA redirect - Updated to use ?redirect= format
    var BASE_PATH = '/';
    var original = location.pathname + location.search + location.hash;
    if (location.pathname !== BASE_PATH && !location.search.includes('redirect=')) {
      var dest = BASE_PATH + 'index.html?redirect=' + encodeURIComponent(original);
      location.replace(dest);
    }
  </script>
</head>
<body>
</body>
</html>

<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>アオバシャチホコ 応援テスト - 図鑑デザイン連携</title>
  <meta name="description" content="図鑑の現行ページデザインをそのまま利用し、保全団体と応援プログラム（テスト）・活動を支える企業（テスト）を差し込んで確認するページです。">
  <link rel="canonical" href="https://orau98.github.io/meta/moth/species-4601-support-test.html">
</head>
<body style="margin:0; background:#fff;">
  <!-- 現行SPAページを完全ロードし、そのDOMへテストセクションを差し込む方式（デザイン完全一致） -->
  <iframe id="spaFrame" src="/moth/species-4601" title="アオバシャチホコ（現行ページ埋め込み）" style="width:100%; border:0; display:block;"></iframe>

  <script>
  (function(){
    const iframe = document.getElementById('spaFrame');

    function setHeight() {
      try {
        const doc = iframe.contentDocument;
        if (!doc) return;
        const root = doc.documentElement;
        const scroller = doc.scrollingElement || root;
        const body = doc.body || root;
        const h = Math.max(
          scroller.scrollHeight || 0,
          root.scrollHeight || 0,
          body.scrollHeight || 0,
          root.offsetHeight || 0,
          root.clientHeight || 0
        );
        if (h && h !== iframe._lastH) {
          iframe.style.height = h + 'px';
          iframe._lastH = h;
        }
      } catch (e) {}
    }

    function injectSections() {
      try {
        const doc = iframe.contentDocument;
        if (!doc) return false;

        // 左カラムの画像カードブロックを特定（aspect-[4/3]）
        const imageBlock = doc.querySelector('.aspect-\\[4\\/3\\]') || doc.querySelector('[class*="aspect-"][class*="4/3"]');
        if (!imageBlock) return false;

        // 画像カードの外側カード要素（rounded/shadow/border等を持つ親）を探索
        let imageCard = imageBlock;
        for (let i = 0; i < 6 && imageCard; i++) {
          const cls = (imageCard.className || '').toString();
          if (/rounded|shadow|border|overflow/.test(cls)) break;
          imageCard = imageCard.parentElement;
        }
        if (!imageCard || !imageCard.parentElement) return false;

        // 既に挿入済みならスキップ
        if (doc.getElementById('conservation-support-test-section')) return true;

        // 1枚目: 保全団体と応援プログラム
        const html1 = `
          <section id="conservation-support-test-section" class="bg-white/80 dark:bg-slate-800/70 backdrop-blur rounded-2xl shadow-xl border border-white/40 dark:border-slate-700/60 p-6 space-y-6">
            <div>
              <span class="inline-flex items-center px-3 py-1 rounded-full bg-emerald-100 text-emerald-700 dark:bg-emerald-900/40 dark:text-emerald-300 text-xs font-semibold tracking-wide">
                推し活 ✕ 保全（テスト）
              </span>
              <h3 class="mt-3 text-xl font-bold text-slate-800 dark:text-slate-100">アオバシャチホコ を応援する保全モデル</h3>
              <p class="mt-2 text-sm text-slate-600 dark:text-slate-300 leading-relaxed">
                図鑑で得た知識をそのまま応援アクションに変換できるテスト機能です。保全団体の活動を可視化し、推し活感覚で寄付・参加ができる導線を検証しています。
              </p>
            </div>

            <div class="rounded-2xl border border-emerald-200/60 dark:border-emerald-800/40 bg-emerald-50/60 dark:bg-emerald-950/20 p-5 space-y-4">
              <div class="flex flex-col sm:flex-row sm:items-start sm:justify-between gap-3">
                <div>
                  <h4 class="text-lg font-semibold text-emerald-800 dark:text-emerald-200">アオバの森リカバリープロジェクト</h4>
                  <p class="text-sm text-emerald-700/80 dark:text-emerald-200/80">活動地域：北関東〜中部地方の広葉樹林</p>
                </div>
                <a href="mailto:info@aobamori.jp" class="inline-flex items-center px-3 py-1 text-sm font-semibold text-emerald-800 dark:text-emerald-100 bg-white/80 dark:bg-slate-900/30 border border-emerald-200/60 dark:border-emerald-800/50 rounded-full hover:bg-white focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-emerald-500 transition-colors">お問い合わせ</a>
              </div>
              <ul class="space-y-2 text-sm text-emerald-900/90 dark:text-emerald-100/90 leading-relaxed">
                <li class="flex items-start gap-2"><span class="mt-1 w-2 h-2 rounded-full bg-emerald-500"></span>ミズキ科植物の植栽と林床管理による生息環境再生</li>
                <li class="flex items-start gap-2"><span class="mt-1 w-2 h-2 rounded-full bg-emerald-500"></span>幼虫発生期のモニタリングと市民参加型観察会の開催</li>
                <li class="flex items-start gap-2"><span class="mt-1 w-2 h-2 rounded-full bg-emerald-500"></span>自治体・農家と協働したライトトラップ運用の最適化</li>
              </ul>
              <dl class="grid grid-cols-1 sm:grid-cols-2 gap-x-6 gap-y-2 text-sm text-emerald-900/80 dark:text-emerald-100/80">
                <div class="flex items-center gap-2"><dt class="font-semibold text-emerald-700 dark:text-emerald-200 min-w-[3rem]">設立</dt><dd>2014年</dd></div>
                <div class="flex items-center gap-2"><dt class="font-semibold text-emerald-700 dark:text-emerald-200 min-w-[3rem]">代表</dt><dd>森田 葉月</dd></div>
                <div class="flex items-center gap-2 sm:col-span-2"><dt class="font-semibold text-emerald-700 dark:text-emerald-200 min-w-[5rem]">透明性</dt><dd><a href="https://example.org/aoba-report.pdf" target="_blank" rel="noopener noreferrer" class="text-emerald-800 dark:text-emerald-200 underline decoration-emerald-300/70 hover:decoration-emerald-500">2023透明性レポート（PDF）</a></dd></div>
              </dl>

              <div class="space-y-3">
                <p class="text-sm text-emerald-900/80 dark:text-emerald-100/80">推し活名で応援プランを選択し、活動の継続を後押しできます。</p>
                <button type="button" class="mt-1 inline-flex items-center justify-center rounded-full bg-emerald-600 text-white px-5 py-2 text-sm font-semibold shadow-md shadow-emerald-600/30 hover:bg-emerald-500 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-emerald-500 transition-colors" aria-expanded="false">応援プラン（テストUI）</button>
              </div>
            </div>
          </section>`;

        // 2枚目: 企業サポート
        const html2 = `
          <section id="conservation-sponsors-test-section" class="bg-white/80 dark:bg-slate-800/70 backdrop-blur rounded-2xl shadow-xl border border-white/40 dark:border-slate-700/60 p-6">
            <div class="flex items-center justify-between gap-4 flex-wrap">
              <div>
                <h4 class="text-lg font-semibold text-slate-800 dark:text-slate-100">活動を支える企業（テスト）</h4>
                <p class="mt-1 text-sm text-slate-600 dark:text-slate-300">企業サポートも推し活の大切なパートナー。支援内容をロゴと一緒に掲示し、協働の姿を紹介しています。</p>
              </div>
              <span class="text-xs text-slate-500 dark:text-slate-400 font-semibold">β 版 UI</span>
            </div>
            <div class="mt-4 grid gap-3 sm:grid-cols-2">
              ${[{
                  name:'GreenPulse テクノロジーズ', note:'ドローン解析で生息域の植生を高頻度モニタリング'
                },{
                  name:'LeafWorks ホールディングス', note:'苗木供給とCSR寄付プログラムで植栽をバックアップ'
                },{
                  name:'ForestLink バンク', note:'寄付決済と成果連動型資金プランを共同開発'
                }].map(s => `
                <article class="flex items-start gap-3 rounded-xl border border-slate-200/70 dark:border-slate-700/60 bg-white/80 dark:bg-slate-900/60 p-3">
                  <div class="flex h-12 w-12 items-center justify-center rounded-lg bg-emerald-100/70 dark:bg-emerald-900/40">
                    <svg viewBox='0 0 48 48' xmlns='http://www.w3.org/2000/svg' class='w-9 h-9 text-emerald-700'><rect x='6' y='6' width='36' height='36' rx='10' fill='#d1fae5'/></svg>
                  </div>
                  <div>
                    <h5 class="text-sm font-semibold text-slate-800 dark:text-slate-100">${s.name}</h5>
                    <p class="mt-1 text-xs text-slate-600 dark:text-slate-300 leading-relaxed">${s.note}</p>
                  </div>
                </article>
              `).join('')}
            </div>
          </section>`;

        // 画像カード直下に2枚のカードを順に差し込む
        const node1 = doc.createElement('div');
        node1.innerHTML = html1;
        const node2 = doc.createElement('div');
        node2.innerHTML = html2;
        imageCard.insertAdjacentElement('afterend', node1.firstElementChild);
        imageCard.nextElementSibling.insertAdjacentElement('afterend', node2.firstElementChild);
        return true;
      } catch (e) { return false; }
    }

    function afterLoad() {
      // 試行的に複数回チャレンジ（Reactの描画完了を待つ）
      let attempts = 0;
      const tryInject = () => {
        const done = injectSections();
        setHeight();
        attempts++;
        if (!done && attempts < 50) {
          setTimeout(tryInject, 200);
        }
      };
      tryInject();

      try {
        const doc = iframe.contentDocument;
        const update = () => setHeight();
        // Observe DOM mutations (structure/style changes)
        const mo = new MutationObserver(() => {
          const ok = doc.getElementById('conservation-support-test-section') || injectSections();
          update();
        });
        mo.observe(doc.documentElement, { childList: true, subtree: true, attributes: true });
        // Observe size changes precisely
        if (typeof ResizeObserver !== 'undefined') {
          try { new ResizeObserver(update).observe(doc.documentElement); } catch {}
          try { new ResizeObserver(update).observe(doc.body); } catch {}
        }
        // Fallback periodic adjustments for late-loading assets
        let ticks = 0;
        const timer = setInterval(() => { update(); if (++ticks > 40) clearInterval(timer); }, 250);
        window.addEventListener('resize', setHeight);
      } catch (e) {}
    }

    iframe.addEventListener('load', afterLoad);
  })();
  </script>
</body>
</html>
